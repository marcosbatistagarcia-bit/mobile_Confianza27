<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Confianza: Sistema de Gestão de Riscos & Confiabilidade">
</head><body><title>Confianza R1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231b2026'/><path d='M45.5 20.5A17 17 0 1 0 45.5 43.5' stroke='%23f2b134' stroke-width='9' fill='none' stroke-linecap='round'/><circle cx='49' cy='32' r='4.2' fill='%23d5dbe1'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2026">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap">
<style>

/* Layout: graphite instrument-rail on the left (top strip on phones), cool work surface on the right; numbers set in mono like a dashboard cluster. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#14181c; --ink-2:#47505a; --ink-3:#717b86; --line:#d6dbe0; --line-2:#e6e9ed;
  --accent:#1f56b3; --accent-ink:#ffffff; --accent-soft:#e3ebf8;
  --rail:#1b2026; --rail-2:#262d35; --rail-ink:#d5dbe1; --rail-ink-2:#8f99a4; --rail-accent:#f2b134;
  --good:#1e7a43; --good-soft:#e0f1e6; --warn:#a86a00; --warn-soft:#fbefd6; --bad:#c3282d; --bad-soft:#fbe3e3;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e3e7eb;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#191d21; --surface-2:#20252a; --ink:#e8ecef; --ink-2:#b2bac2; --ink-3:#86909a; --line:#2d343b; --line-2:#252b31;
  --accent:#7aa5f2; --accent-ink:#0d1420; --accent-soft:#1d2a40;
  --rail:#0b0e11; --rail-2:#161b20; --rail-ink:#d5dbe1; --rail-ink-2:#8792a0; --rail-accent:#f2b134;
  --good:#52c27c; --good-soft:#15291d; --warn:#e2a83d; --warn-soft:#2d2412; --bad:#f06a63; --bad-soft:#331a1a;
  --s1:#3987e5; --s2:#d95926; --grid:#272d33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#191d21; --surface-2:#20252a; --ink:#e8ecef; --ink-2:#b2bac2; --ink-3:#86909a; --line:#2d343b; --line-2:#252b31;
  --accent:#7aa5f2; --accent-ink:#0d1420; --accent-soft:#1d2a40;
  --rail:#0b0e11; --rail-2:#161b20; --rail-ink:#d5dbe1; --rail-ink-2:#8792a0; --rail-accent:#f2b134;
  --good:#52c27c; --good-soft:#15291d; --warn:#e2a83d; --warn-soft:#2d2412; --bad:#f06a63; --bad-soft:#331a1a;
  --s1:#3987e5; --s2:#d95926; --grid:#272d33; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px 16px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;cursor:pointer;background:none;border:0;text-align:left}
.brand svg{flex:none}
.brand .brand-full{width:100%;max-width:200px;height:auto;display:block}
.brand .brand-sym,.brand .brand-word{display:none}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.04em;color:#fff;line-height:1}
.brand small{display:block;font-size:10.5px;color:var(--rail-ink-2);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--rail-ink-2);padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--rail-ink);padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13.5px}
.nav button:hover{background:var(--rail-2)}
.nav button[aria-current="page"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--rail-accent)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--rail-ink-2)}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--rail-ink-2);padding:0 10px;display:flex;flex-direction:column;gap:6px}
.mode-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rail-ink-2);margin-right:6px}
.mode-dot.on{background:#4cc27a}
/* main */
.main{min-width:0;padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.page-head h1{font-size:32px;line-height:1.05}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:19px}
.panel .sub{color:var(--ink-3);font-size:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
/* filter bar */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:500}
.fld select,.fld input,.fld textarea,.cell-in{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.fld textarea{min-height:68px;resize:vertical}
.filters .fld{width:170px}
.filters .fld.grow{flex:1;min-width:160px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-lbl{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .k-val{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.05;letter-spacing:-.01em}
.kpi .k-val small{font-family:var(--f-body);font-size:13px;color:var(--ink-3);font-weight:500;margin-left:4px;letter-spacing:0}
.kpi .k-src{font-size:11.5px;color:var(--ink-3);margin-top:auto}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.pair{display:flex;gap:18px;flex-wrap:wrap}
.pair>div{display:flex;flex-direction:column}
.pair .k-val{font-size:24px}
.hbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:12.5px}
.hbar .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar .fill{height:100%;background:var(--s1);border-radius:0 3px 3px 0}
/* signal */
.signal{display:flex;gap:14px;align-items:center}
.lamp{display:flex;flex-direction:column;gap:6px;background:var(--rail);padding:8px;border-radius:14px}
.lamp i{width:22px;height:22px;border-radius:50%;background:#2d343b;display:block}
.lamp i.r.on{background:#e5484d;box-shadow:0 0 10px #e5484d}
.lamp i.y.on{background:#f2b134;box-shadow:0 0 10px #f2b134}
.lamp i.g.on{background:#3fbf6f;box-shadow:0 0 10px #3fbf6f}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.N{color:var(--good);background:var(--good-soft)}
.pill.A{color:var(--warn);background:var(--warn-soft)}
.pill.X{color:var(--bad);background:var(--bad-soft)}
.pill.I{color:var(--ink-2);background:var(--surface-2)}
.pill.done{color:var(--good);background:var(--good-soft)}
.pill.open{color:var(--accent);background:var(--accent-soft)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
td .num,td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.wrap-cell{white-space:normal;min-width:180px;max-width:320px}
/* home */
.hero{background:var(--rail);color:var(--rail-ink);border-radius:14px;padding:28px 28px 24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;position:relative;overflow:hidden}
.hero h1{font-size:44px;line-height:.98;color:#fff;font-weight:700;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--rail-accent)}
.hero p{color:var(--rail-ink-2);max-width:52ch;margin:12px 0 0}
.hero .road{position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--rail-accent) 0 38px,transparent 38px 64px);opacity:.55}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center}
.hero-stats div{background:var(--rail-2);border-radius:10px;padding:12px 14px}
.hero-stats b{display:block;font-family:var(--f-mono);font-size:24px;color:#fff;font-weight:500}
.hero-stats span{font-size:12px;color:var(--rail-ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:19px;display:flex;align-items:center;gap:8px}
.tile h3 svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8}
.tile p{margin:0;color:var(--ink-2);font-size:13px}
.tile .meta{font-size:12px;color:var(--ink-3);margin-top:auto;padding-top:6px}
/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--f-mono);font-size:10.5px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ref{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:4 3}
.chart .reftx{fill:var(--bad)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;z-index:3;line-height:1.35}
.tip b{font-family:var(--f-mono);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.spark-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.spark-row:first-of-type{border-top:0}
.spark-row .avg{text-align:right}
.spark-row .avg b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500}
.spark-row .avg span{font-size:11px;color:var(--ink-3)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,13,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(1180px,100%)}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:22px}
.m-head .x{margin-left:auto}
.m-body{padding:16px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.m-foot .left{margin-right:auto;display:flex;gap:8px;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form-grid .s2{grid-column:span 2}.form-grid .s4{grid-column:1/-1}
.dsec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dsec>h3{font-size:17px;display:flex;align-items:center;gap:8px}
.dsec>h3 .tag{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--rail);color:var(--rail-accent);padding:2px 6px;border-radius:5px}
.dsec.done>h3 .tag{background:var(--good);color:#fff}
.calc{background:var(--surface-2);border-radius:7px;padding:7px 9px;font-family:var(--f-mono)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;font-weight:500;flex-wrap:wrap}
.banner.X{background:var(--bad-soft);color:var(--bad)}
.banner.A{background:var(--warn-soft);color:var(--warn)}
.banner.N{background:var(--good-soft);color:var(--good)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.steps{display:flex;gap:3px}
.steps i{width:9px;height:9px;border-radius:2px;background:var(--line);display:block}
.steps i.on{background:var(--good)}
.cell-in{padding:4px 6px;width:76px;text-align:right;font-family:var(--f-mono);font-size:12.5px}
.cell-in.txt{text-align:left;width:96px;font-family:var(--f-body)}
td.st-N{box-shadow:inset 3px 0 0 var(--good)} td.st-A{box-shadow:inset 3px 0 0 var(--warn)} td.st-X{box-shadow:inset 3px 0 0 var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;background:var(--surface-2)}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);width:20px;height:20px;border-radius:50%}
.chip button:hover{background:var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.notice{font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rpn-1{color:var(--good)} .rpn-2{color:var(--warn)} .rpn-3{color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-weight:500;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sim-grid{grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}
.sim-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details.ref summary{cursor:pointer;color:var(--accent);font-weight:500}
@media (max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7{grid-column:span 12}.c8{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));gap:8px;z-index:20;overflow:visible}
  .rail-foot{display:none}
  .brand{padding:0;gap:8px}
  .brand .brand-full{display:none}
  .brand .brand-sym{display:block;width:30px;height:30px}
  .brand .brand-word{display:block;font-size:21px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;padding:7px 10px;width:auto}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--rail-accent)}
  .nav .cnt{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}
  .hero h1{font-size:34px}
  .c3,.c4,.c6{grid-column:span 12}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.sim-grid{grid-template-columns:minmax(0,1fr)}
  .filters .fld{width:calc(50% - 5px)}
  .page-head h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== R1: cabeçalho, perfis, idiomas, componentes novos ===== */
:root{--standby:#8b949e;--standby-soft:#eceef1;--gold:#c9952b;--navy:#122b4a;--teal:#0e6e6e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--standby:#9aa4ae;--standby-soft:#262c33}}
:root[data-theme="dark"]{--standby:#9aa4ae;--standby-soft:#262c33}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);padding-block:10px;margin:-22px 0 14px;border-bottom:1px solid var(--line)}

<script>
/* Confianza R1 — motor de cálculo (puro, sem DOM). Usado pela página e pelos testes (node). */
const CALC = (() => {
"use strict";
const isNum = x => typeof x === 'number' && isFinite(x);
const avg = a => { a = a.filter(isNum); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
const sum = a => a.filter(isNum).reduce((s, x) => s + x, 0);

/* ---------- Gama (Lanczos) ---------- */
const LG = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
function gamma(z) {
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
  z -= 1; let x = 0.99999999999980993;
  for (let i = 0; i < 8; i++) x += LG[i] / (z + i + 1);
  const t = z + 7.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}

/* ---------- Weibull: funções ---------- */
const W = {
  R: (t, b, e) => Math.exp(-Math.pow(Math.max(t, 0) / e, b)),
  F: (t, b, e) => 1 - W.R(t, b, e),
  f: (t, b, e) => (b / e) * Math.pow(t / e, b - 1) * Math.exp(-Math.pow(t / e, b)),
  h: (t, b, e) => (b / e) * Math.pow(t / e, b - 1),
  Bx: (x, b, e) => e * Math.pow(-Math.log(1 - x / 100), 1 / b),
  MTTF: (b, e) => e * gamma(1 + 1 / b),
  fase: b => b < 0.95 ? 'infantil' : b <= 1.05 ? 'aleatoria' : 'desgaste'
};

/* Ajuste por máxima verossimilhança com censura à direita.
   dados: [{t:number, falha:boolean}] — t > 0. Retorna null se < 2 falhas. */
function weibullMLE(dados) {
  const all = dados.filter(d => isNum(d.t) && d.t > 0);
  const fails = all.filter(d => d.falha);
  const r = fails.length;
  if (r < 2) return null;
  const sc = Math.max(...all.map(d => d.t));           // escala para estabilidade numérica
  const x = all.map(d => d.t / sc), lnx = x.map(Math.log);
  const lnf = fails.map(d => Math.log(d.t / sc));
  const meanLnF = lnf.reduce((s, v) => s + v, 0) / r;
  const g = b => {
    let s0 = 0, s1 = 0;
    for (let i = 0; i < x.length; i++) { const xb = Math.pow(x[i], b); s0 += xb; s1 += xb * lnx[i]; }
    return s1 / s0 - 1 / b - meanLnF;
  };
  let lo = 0.02, hi = 60;
  if (g(lo) > 0 || g(hi) < 0) return null;            // sem solução (dados degenerados)
  for (let k = 0; k < 200; k++) { const m = (lo + hi) / 2; if (g(m) > 0) hi = m; else lo = m; if (hi - lo < 1e-12) break; }
  const beta = (lo + hi) / 2;
  const s0 = x.reduce((s, v) => s + Math.pow(v, beta), 0);
  const eta = Math.pow(s0 / r, 1 / beta) * sc;
  const cov = weibullCov(all, beta, eta);
  return { beta, eta, r, n: all.length, censurados: all.length - r, cov, metodo: 'MLE' };
}
function weibullLL(all, b, e) {
  let ll = 0;
  for (const d of all) { const z = d.t / e; ll -= Math.pow(z, b); if (d.falha) ll += Math.log(b / e) + (b - 1) * Math.log(z); }
  return ll;
}
/* Matriz de covariância = inversa da informação observada (Hessiana numérica) */
function weibullCov(all, b, e) {
  const hb = b * 1e-4, he = e * 1e-4, L = (bb, ee) => weibullLL(all, bb, ee);
  const f0 = L(b, e);
  const dbb = (L(b + hb, e) - 2 * f0 + L(b - hb, e)) / (hb * hb);
  const dee = (L(b, e + he) - 2 * f0 + L(b, e - he)) / (he * he);
  const dbe = (L(b + hb, e + he) - L(b + hb, e - he) - L(b - hb, e + he) + L(b - hb, e - he)) / (4 * hb * he);
  const I11 = -dbb, I22 = -dee, I12 = -dbe, det = I11 * I22 - I12 * I12;
  if (!(det > 0)) return null;
  return { bb: I22 / det, ee: I11 / det, be: -I12 / det };

const Z95 = 1.959963984540054;
function weibullIC(fit) {
  if (!fit || !fit.cov) return null;
  const { beta: b, eta: e, cov } = fit;
  const sb = Math.sqrt(cov.bb), se = Math.sqrt(cov.ee);
  return { beta: [b * Math.exp(-Z95 * sb / b), b * Math.exp(Z95 * sb / b)], eta: [e * Math.exp(-Z95 * se / e), e * Math.exp(Z95 * se / e)] };
}
function icR(fit, t) {
  if (!fit || !fit.cov || !(t > 0)) return null;
  const { beta: b, eta: e, cov } = fit; const u = b * (Math.log(t) - Math.log(e));
  const v = (u / b) ** 2 * cov.bb + (b / e) ** 2 * cov.ee - 2 * (u / e) * cov.be;
  if (!(v >= 0)) return null; const s = Math.sqrt(v);
  return [Math.exp(-Math.exp(u + Z95 * s)), Math.exp(-Math.exp(u - Z95 * s))];
}
function icBx(fit, x) {
  if (!fit || !fit.cov) return null;
  const { beta: b, eta: e, cov } = fit; const k = Math.log(-Math.log(1 - x / 100));
  const lnB = Math.log(e) + k / b;
  const v = (k * k / b ** 4) * cov.bb + cov.ee / (e * e) - 2 * k / (b * b * e) * cov.be;

  return [Math.exp(lnB - Z95 * s), Math.exp(lnB + Z95 * s)];

/* Postos medianos (ajuste de Johnson para censura + aproximação de Bernard) */
function postosMedianos(dados) {
  const all = dados.filter(d => isNum(d.t) && d.t > 0).slice().sort((a, b) => a.t - b.t || (a.falha ? -1 : 1));
  const n = all.length; let O = 0; const pts = [];

    O = O + (n + 1 - O) / (1 + rr);

function weibullRRY(dados) {
  const p = postosMedianos(dados); if (p.length < 2) return null;

function manutencao({ usoOperacao, horasOperacao, nReparos, horasReparo }) {
  const MTBF = nReparos ? usoOperacao / nReparos : null;

function backendCheck(coll, rec, prev) {

    if (coll === 'usuarios' && rec.id === u.id && prev && (rec.perfil !== prev.perfil || rec.empresaId !== prev.empresaId)) return t('Sem permissão para esta operação.');

/* frase da home: uma linha, mesma largura do título "Sistema de Gestão…" */
function fitTagline() {
  const tg = document.querySelector('.hero .tagline'), eb = document.querySelector('.hero .eyebrow'); if (!tg || !eb) return;
  tg.style.whiteSpace = 'nowrap'; tg.style.fontSize = '20px';
  const box = tg.parentElement.clientWidth, w = Math.min(eb.getBoundingClientRect().width, box), tw = tg.scrollWidth;
  if (!(w > 0 && tw > 0)) return;
  const fs = 20 * w / tw;
  if (fs >= 10.5) tg.style.fontSize = fs.toFixed(2) + 'px';
  else { tg.style.fontSize = '12px'; tg.style.whiteSpace = 'normal'; } /* tela estreita: quebra em vez de ficar ilegível */
}
window.addEventListener('resize', () => { clearTimeout(window.__fitT); window.__fitT = setTimeout(fitTagline, 80); });
document.fonts && document.fonts.ready.then(fitTagline);

/* ---------- "Ainda não tenho cadastro" ----------
   Usuário de empresa que já usa o Confianza: o acesso é criado pelo administrador da conta (regra de perfis).

  const tipo = UI.cadTipo || 'nova', v = UI.cad || {};
  const radio = (k, l) => `<label class="chk"><input type="radio" name="cadTipo" value="${k}" data-chg="cadTipo"${tipo === k ? ' checked' : ''}> <span>${t(l)}</span></label>`;

     <div class="fld"><label for="cdFone">${t('Telefone / WhatsApp')}</label><input id="cdFone" type="tel" autocomplete="tel" value="${esc(v.fone || '')}"></div>

     <div class="fld"><label for="cdMsg">${t('Mensagem (opcional)')}</label><textarea id="cdMsg" rows="3">${esc(v.msg || '')}</textarea></div>
     <label class="chk small"><input type="checkbox" id="cdOk"${v.ok ? ' checked' : ''}> <span>${t('Autorizo o uso destes dados para analisar o pedido e entrar em contato (LGPD).')}</span></label>
     <button type="button" class="btn pri" data-act="cadEnviar">${t('Enviar pedido de cadastro')}</button><button type="button" class="btn ghost" data-act="loginVoltar">${t('Voltar ao login')}</button>`;
  return `<h2>${t('Ainda não tenho cadastro')}</h2>${radio('nova', 'Quero cadastrar a minha empresa no Confianza')}${radio('existente', 'Minha empresa já usa o Confianza')}${corpo}`;

async function cadEnviar() {
  const v = { nome: $('#cdNome').value.trim(), email: $('#cdEmail').value.trim().toLowerCase(), fone: $('#cdFone').value.trim(), empresa: $('#cdEmp').value.trim(), cnpj: $('#cdCnpj').value.trim(), segmento: $('#cdSeg').value, msg: $('#cdMsg').value.trim(), ok: $('#cdOk').checked };
  UI.cad = v;
  if (!v.nome || !v.email || !v.empresa || !v.segmento) { UI.loginMsg = t('Preencha os campos obrigatórios (*).'); render(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) { UI.loginMsg = t('E-mail inválido.'); render(); return; }
  if (!v.ok) { UI.loginMsg = t('Marque a autorização de uso dos dados para enviar.'); render(); return; }
  const id = newId('cad'); const rec = { nome: v.nome, email: v.email, fone: v.fone, empresa: v.empresa, cnpj: v.cnpj, segmento: v.segmento, mensagem: v.msg, consentimento: new Date().toISOString(), status: 'pendente', em: new Date().toISOString(), idioma: LANG };
  if (!await saveDoc('cadastros', id, rec, { sistema: true })) return;
  for (const p of S.usuarios.filter(u => u.perfil === 'plataforma' && u.ativo !== false))
    await Mailer.enviar({ para: p.id, empresaId: null, tipo: 'cadastro', link: { rota: 'plataforma' }, assunto: lg => tl('Novo pedido de cadastro: {e}', lg, { e: v.empresa }), corpo: lg => tl('{n} ({m}) pediu o cadastro da empresa {e} ({s}). Aprove ou recuse em Plataforma → Pedidos de cadastro.', lg, { n: v.nome, m: v.email, e: v.empresa, s: tl(v.segmento, lg) }) });
  await Mailer.enviar({ email: v.email, empresaId: null, tipo: 'cadastro', assunto: t('Recebemos o seu pedido de cadastro'), corpo: t('Olá, {n}. Recebemos o pedido de cadastro da empresa {e}. Responderemos neste e-mail, normalmente em até 2 dias úteis.', { n: v.nome, e: v.empresa }) });
  UI.cad = {}; UI.loginMsg = ''; UI.loginStep = 'cadastroOk'; render();
}

/* ---------- Combustível ---------- */
VIEWS.combustivel = () => {
  const c = CFG(); const tel = scoped('telemetria').filter(r => passF(r, r.mes));
  const por = {}; tel.forEach(r => { const k = r.equipId || '—'; (por[k] = por[k] || []).push(r); });
  const rows = Object.entries(por).map(([id, rs]) => { const op = rs.filter(r => r.distancia > 0 && r.combustivel > 0); const dist = sum(op.map(r => r.distancia)), litros = sum(op.map(r => r.combustivel)); const km_l = litros ? dist / litros : null;
    return { e: equipBy(id), dist, litros, km_l, eco: km_l ? (km_l / c.consumoReferencia - 1) * 100 : null, co2: litros * c.fatorCO2, arv: litros * c.fatorCO2 * c.fatorArvores }; });
  const tot = { dist: sum(rows.map(r => r.dist)), litros: sum(rows.map(r => r.litros)) };
  return head(t('Combustível'), t('Consumo por equipamento a partir da telemetria, comparado ao consumo de referência de {r} km/l.', { r: fmt(c.consumoReferencia, 1) })) +
   ilustra('comb', t('Bomba de combustível'), t('Economia de combustível = consumo medido ÷ consumo de referência − 1. Emissão de CO₂ = litros × fator de emissão do diesel.')) + filtrosEquip() +
   `<div class="kpis" style="margin-bottom:14px"><div class="kpi c4"><span class="k-lbl">${t('Consumo médio da frota')}</span><span class="k-val">${fmt(tot.litros ? tot.dist / tot.litros : null, 2)}<small>km/l</small></span></div><div class="kpi c4"><span class="k-lbl">${t('Combustível no período')}</span><span class="k-val">${fmt(tot.litros, 0)}<small>l</small></span></div><div class="kpi c4"><span class="k-lbl">${t('Emissão de CO₂ no período')}</span><span class="k-val">${fmt(tot.litros * c.fatorCO2, 0)}<small>kg</small></span></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>${t('Equipamento')}</th><th class="r">${t('Distância')}</th><th class="r">${t('Combustível (l)')}</th><th class="r">${t('Consumo (km/l)')}</th><th class="r">${t('Economia vs referência')}</th><th class="r">CO₂ (kg)</th><th class="r">${t('Árvores')}</th></tr></thead><tbody>
   ${rows.map(r => `<tr><td>${esc(equipLabel(r.e))}</td><td class="r num">${fmt(r.dist, 0)}</td><td class="r num">${fmt(r.litros, 0)}</td><td class="r num">${fmt(r.km_l, 2)}</td><td class="r num">${isNum(r.eco) ? fmt(r.eco, 1) + '%' : '—'}</td><td class="r num">${fmt(r.co2, 0)}</td><td class="r num">${fmt(r.arv, 2)}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">${t('Nenhum registro com esses filtros.')}</td></tr>`}</tbody></table></div>`;
};

VIEWS.lubDetail = () => {
  const r = S.lubrificantes.find(x => x.id === UI.id); if (!r) return head(t('Laudo não encontrado'), '', `<button class="btn" data-nav="lubrificantes">${t('Voltar')}</button>`);
  const c = lubCalc(r); const am = r.amostras || []; const e = equipBy(r.equipId);
  const axes = LUB_PARAMS.map(p => { const v = lastVal(r, p.k); if (!isNum(v)) return null; const ref = ((r.referencias || {})[p.k] || {}).novo; const lim = lubLimit(r, p);

    if (p.regra === 'min') return isNum(lim) && v ? { l: p.nome.split(' (')[0], v: lim / v * 100 } : null;
    return isNum(lim) && lim ? { l: p.nome.split(' (')[0], v: v / lim * 100 } : null; }).filter(Boolean);

  return head(`${t('Laudo')} ${esc(r.ordem)}`, esc(equipLabel(e)), `${escalarBtn('Lubrificantes', r.id, t('Laudo') + ' ' + r.ordem, 'lubDetail')}<button class="btn" data-act="lubEditar" data-id="${esc(r.id)}">${ic('edit')}${t('Editar laudo e resultados')}</button>`, `<button data-nav="lubrificantes">${t('Lubrificantes')}</button> / ${esc(r.ordem)}`) +
  `<div class="stack">${banner}
   <div class="kpis" style="align-items:start">
    <div class="kpi c3"><span class="k-lbl">${t('Expectativa de vida')}</span><span class="k-val">${fmt(c.exp, 0)}<small>km</small></span><span class="k-src">${t('Tendência do ferro acumulado até o limite por coleta')}</span></div>
    <div class="kpi c3"><span class="k-lbl">${t('Previsão de troca')}</span><span class="k-val">${fmt(c.prev, 0)}<small>km</small></span><span class="k-src">${t('Tendência da viscosidade 100°C acumulada')}</span></div>
    <div class="kpi c3"><span class="k-lbl">${t('Fator de depreciação (mensal)')}${fx('K = (1 − J) ÷ (expectativa ÷ 50 ÷ 10 ÷ 22)\nJ = 1 ÷ (vida útil em anos × 12)')}</span><span class="k-val">${fmt(c.fator, 3)}<small>%</small></span><span class="k-src">${t('Vida útil')} ${CFG().vidaUtilAnos[r.categoria] || '—'} ${t('anos')}</span></div>
    <div class="kpi c3"><span class="k-lbl">${t('Informações')}</span><div class="kv small"><div><span class="lbl">${t('Motorização')}</span><b>${esc(r.motorizacao || '—')}</b></div><div><span class="lbl">${t('Laboratório')}</span><b>${esc(r.laboratorio || '—')}</b></div><div><span class="lbl">${t('Lubrificante A')}</span><b>${esc(r.fornA || '—')}</b></div><div><span class="lbl">${t('Lubrificante B')}</span><b>${esc(r.fornB || '—')}</b></div></div></div></div>
   <div class="panel"><h2>${t('Descrição do laudo')}</h2>${CALC.textoValido(r.descricao) ? `<p style="white-space:pre-wrap;margin:6px 0 0">${esc(r.descricao)}</p>` : `<p class="muted">${t('Descrição pendente (mínimo de 150 caracteres).')}</p>`}</div>
   <div class="split">
    <div class="panel"><h2>${t('Radar dos parâmetros')}</h2><p class="sub">${t('Último resultado em % do limite (desvio para viscosidades; limite ÷ valor para TBN e aditivos). Acima de 100% passa do limite.')}</p>${radarChart(axes)}</div>

   </tbody></table></div></div>`;
};
function lubForm(r) {

    const last = [...scoped('lubrificantes')].sort((a, b) => (b.data || '').localeCompare(a.data || ''))[0]; r = { ordem: ord, data: hoje(), amostras: [], referencias: last ? clone(last.referencias || {}) : {} }; }

function indicadoresPeca(codigo) {
  const g = scoped('g8d').filter(x => x.codigoPeca === codigo && !x.origemId); const tc = scoped('telemetria').filter(x => x.situacao === 'Manut. Corretiva' && x.codigoPeca === codigo);

  const c = CFG(); const R = c.weibullRef; const dados = g.map(x => ({ t: x.km, falha: true })); const fit = dados.length >= 5 ? CALC.weibullMLE(dados.concat(eqs.filter(e => !g.some(x => x.equipId === e.id)).map(e => ({ t: usoAtual(e), falha: false })))) : null;

const DCOL = { ink: '#14181c', ink3: '#717b86', line: '#47505a', acc: '#c98a1a', bg: '#ffffff' };

    causas.forEach((c, k) => { const f = (k + 1) / (causas.length + 1); const px = bx + (jx - bx) * f, py = by + (my - by) * f; g += `<line x1="${px - 70}" y1="${py}" x2="${px}" y2="${py}" stroke="${DCOL.ink3}" stroke-width="1"/><text x="${px - 72}" y="${py - 3}" text-anchor="end" font-size="10.5" fill="${DCOL.ink}">${esc(c.slice(0, 26))}</text>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img" aria-label="Ishikawa">${g}</svg>`;

  roots.forEach(r => place(r, 0));

    if (gate) g += `<path d="M${x - 16} ${y + 52} Q${x} ${y + 36} ${x + 16} ${y + 52} ${n.tipo === 'E' ? `V${y + 40} H${x - 16} Z` : `Q${x} ${y + 44} ${x - 16} ${y + 52}Z`}" fill="#1b2026"/><text x="${x}" y="${y + 66}" text-anchor="middle" font-size="10" font-weight="700" fill="${DCOL.acc}">${n.tipo === 'E' ? t('E') : t('OU')}</text>`; });

  const st = { pendente: ['A', 'Pendente'], aprovado: ['N', 'Aprovado'], recusado: ['X', 'Recusado'] };
  return `<div class="panel" style="margin-bottom:14px"><h2>${t('Pedidos de cadastro')} <span class="pill A">${ls.filter(c => c.status === 'pendente').length}</span></h2><div class="tbl-wrap"><table><thead><tr><th>${t('Data')}</th><th>${t('Empresa')}</th><th>${t('Segmento')}</th><th>${t('Nome')}</th><th>E-mail</th><th>${t('Telefone')}</th><th>${t('Situação')}</th><th></th></tr></thead><tbody>
   ${ls.map(c => `<tr><td>${dataFmt(c.em)}</td><td>${esc(c.empresa)}${c.cnpj ? `<br><span class="small muted">${esc(c.cnpj)}</span>` : ''}${c.mensagem ? `<br><span class="small muted">${esc(c.mensagem)}</span>` : ''}</td><td>${t(c.segmento)}</td><td>${esc(c.nome)}</td><td>${esc(c.email)}</td><td>${esc(c.fone || '')}</td><td><span class="pill ${st[c.status]?.[0] || 'I'}">${t(st[c.status]?.[1] || c.status)}</span></td>
    <td class="r">${c.status === 'pendente' ? `<button class="btn pri" data-act="cadAprovar" data-id="${esc(c.id)}">${t('Aprovar')}</button> <button class="btn" data-act="cadRecusar" data-id="${esc(c.id)}">${t('Recusar')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
ACT.cadAprovar = a => { const c = S.cadastros.find(x => x.id === a.dataset.id); if (!c) return;
  openModal(`${mHead(t('Aprovar cadastro'))}<form class="m-body" id="frm"><p class="small muted">${t('Cria a empresa e o administrador da conta. Ele recebe por e-mail uma senha provisória.')}</p><div class="form-grid">
   <div class="fld s2"><label for="caE">${t('Empresa')}</label><input id="caE" value="${esc(c.empresa)}"></div><div class="fld"><label for="caS">${t('Segmento')}</label><select id="caS">${optT(SEGMENTOS, c.segmento, 'Selecione…')}</select></div><div class="fld"><label for="caH">${t('Horas presenciais contratadas')}</label><input id="caH" inputmode="decimal" value="0"></div>
   <div class="fld s2"><label for="caN">${t('Administrador da conta')}</label><input id="caN" value="${esc(c.nome)}"></div><div class="fld s2"><label for="caM">E-mail</label><input id="caM" type="email" value="${esc(c.email)}"></div></div></form>
   <div class="m-foot"><button class="btn" data-close>${t('Cancelar')}</button><button class="btn pri" data-save>${t('Aprovar')}</button></div>`, {
    async onSave() { const nome = $('#caE').value.trim(), seg = $('#caS').value, adm = $('#caN').value.trim(), email = $('#caM').value.trim().toLowerCase();
      if (!nome || !seg || !adm || !email) return toast(t('Preencha os campos obrigatórios (*).'));
      if (S.usuarios.some(u => u.email === email)) return toast(t('Já existe um usuário com este e-mail.'));
      const eid = newId('emp'); const emp = { nome, segmento: seg, horasContratadas: toNum($('#caH').value) || 0, codigo: CALC.codigoEmpresa(nome, S.empresas.map(x => x.codigo)), letra: CALC.letra(S.empresas.length), criadaEm: new Date().toISOString(), cfg: clone(DEFAULT_CFG), cnpj: c.cnpj || '' };
      if (!await saveDoc('empresas', eid, emp)) return; audit('criar_empresa', 'empresa', eid, { empresaId: eid });
      const prov = 'Cf' + Math.random().toString(36).slice(2, 8) + '9A'; const uid = newId('u');
      const u = { nome: adm, email, perfil: 'admin', idioma: c.idioma || 'pt', ativo: true, empresaId: eid, criadoEm: new Date().toISOString(), ...(await hashSenha(prov)) };
      if (!await saveDoc('usuarios', uid, u)) return; audit('criar_usuario', 'usuario', uid);
      await saveDoc('cadastros', c.id, { ...c, status: 'aprovado', empresaId: eid, usuarioId: uid, respondidoEm: new Date().toISOString(), respondidoPor: SESSION.user.id }, { sistema: true });
      await Mailer.enviar({ para: uid, email, empresaId: eid, tipo: 'boasvindas', assunto: lg => tl('Bem-vindo ao Confianza', lg), corpo: lg => tl('Seu acesso foi criado. E-mail: {e} · senha provisória: {s}', lg, { e: email, s: prov }) });
      closeModal(); toast(t('Cadastro aprovado: empresa e administrador criados')); } }); };
ACT.cadRecusar = a => { const c = S.cadastros.find(x => x.id === a.dataset.id); if (!c) return;
  openModal(`${mHead(t('Recusar cadastro'))}<form class="m-body" id="frm"><div class="fld"><label for="crM">${t('Motivo (vai no e-mail ao solicitante)')}</label><textarea id="crM" rows="3"></textarea></div></form>
   <div class="m-foot"><button class="btn" data-close>${t('Cancelar')}</button><button class="btn danger" data-save>${t('Recusar')}</button></div>`, {
    async onSave() { const m = $('#crM').value.trim();
      await saveDoc('cadastros', c.id, { ...c, status: 'recusado', motivo: m, respondidoEm: new Date().toISOString(), respondidoPor: SESSION.user.id }, { sistema: true });
      await Mailer.enviar({ email: c.email, empresaId: null, tipo: 'cadastro', assunto: t('Pedido de cadastro no Confianza'), corpo: t('Olá, {n}. Não foi possível aprovar o cadastro da empresa {e}.', { n: c.nome, e: c.empresa }) + (m ? ' ' + m : '') });
      closeModal(); toast(t('Pedido recusado')); } }); };
ACT.pf = el => { UI.tab.pf = { ...(UI.tab.pf || {}), [el.dataset.k]: el.value }; render(); };
ACT.usrNovoPlat = () => usrForm();
ACT.entrarEmp = a => { SESSION.ctx = a.dataset.id; gravarSessao(); nav('inicio'); };
/* ---------- Exportação e importação (com migração da 1ª versão) ---------- */
ACT.exportJSON = () => { const eid = ctxEmpresa(); const o = { formato: 'confianza-r1', exportadoEm: new Date().toISOString(), empresa: empresaBy(eid) };
  ['equipamentos', 'pecas', 'telemetria', 'g8d', 'lubrificantes', 'pneus', 'arrefecimento', 'fmeas', 'fmeaItens', 'planos', 'historico', 'escalacoes', 'solicitacoes', 'retro'].forEach(c => o[c] = scoped(c, eid));
  offerFile(`confianza-${empresaBy(eid)?.codigo || 'backup'}.json`, JSON.stringify(o, null, 1)); };
function migrarV1(o, eid) {
  const out = { equipamentos: [], pecas: [], telemetria: [], g8d: [], lubrificantes: [], pneus: [], fmeas: [], fmeaItens: [], historico: [] }; const cfg = { ...CFG(eid), ...(o.config || {}) }; cfg.modelos = (o.config?.equipamentos || cfg.modelos || []); delete cfg.equipamentos;
  if (o.config?.weibull) { cfg.weibullRef = { beta: o.config.weibull.alfa, eta: o.config.weibull.beta }; delete cfg.weibull; }   // na 1ª versão "alfa" era a forma e "beta" a escala
  const units = {}; const unit = (fab, mod, cat) => { const k = fab + '|' + mod; if (!units[k]) { const id = idFrom(eid + '-eq-' + Object.keys(units).length); units[k] = { id, empresaId: eid, tag: `EQ-${String(Object.keys(units).length + 1).padStart(2, '0')}`, fabricante: fab, modelo: mod, categoria: cat || cfg.modelos.find(m => m.modelo === mod)?.categoria || '', unidade: 'km', usoInicial: 0, migrado: true }; out.equipamentos.push(units[k]); } return units[k].id; };
  const pecas = {}; const peca = comp => { if (!comp) return ''; if (!pecas[comp]) { const cod = comp.normalize('NFD').replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').toUpperCase().slice(0, 3) + '-' + String(Object.keys(pecas).length + 1).padStart(3, '0'); pecas[comp] = cod; out.pecas.push({ id: idFrom(eid + '-pc-' + cod), empresaId: eid, codigo: cod, descricao: comp, sistema: '', migrado: true }); } return pecas[comp]; };
  (o.telemetria || []).forEach(r => out.telemetria.push({ ...r, id: idFrom(eid + '-' + r.id), empresaId: eid, equipId: unit(r.fabricante, r.modelo, r.categoria) }));
  (o.g8d || []).forEach(r => out.g8d.push({ ...r, id: idFrom(eid + '-' + (r.id || r.nc)), empresaId: eid, equipId: unit(r.fabricante, r.modelo, r.categoria), codigoPeca: r.codigoPeca || peca(r.componente), concluidoLegado: !!r.concluido, equipe: r.equipe || [] }));
  (o.lubrificantes || []).forEach(r => out.lubrificantes.push({ ...r, id: idFrom(eid + '-' + r.id), empresaId: eid, equipId: unit(r.fabricante, r.modelo, r.categoria) }));
  (o.pneus || []).forEach(r => out.pneus.push({ ...r, id: idFrom(eid + '-' + r.id), empresaId: eid, equipId: unit(r.fabricante, r.modelo, r.categoria) }));
  if ((o.fmea || []).length) { const fid = idFrom(eid + '-fmea-v1'); out.fmeas.push({ id: fid, empresaId: eid, tipo: 'dFMEA', numero: 'FMEA-V1', titulo: t('FMEA importado da 1ª versão'), dataInicial: hoje(), dataRevisao: hoje(), responsavelId: SESSION.user.id, pdp: { modelo: 'rozenfeld', fases: {} } });
    o.fmea.forEach(r => out.fmeaItens.push({ ...r, id: idFrom(eid + '-' + r.id), empresaId: eid, fmeaId: fid, codigoPeca: peca(r.componente), acoes: r.acoes && Array.isArray(r.acoes) ? r.acoes : (r.acoes ? [{ id: newId('ac'), descricao: r.acoes, status: 'A fazer' }] : []) })); }
  (o.historico || []).forEach(h => out.historico.push({ ...h, id: idFrom(eid + '-' + h.mes), empresaId: eid }));
  return { out, cfg };
}
async function importData(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { toast(t('Arquivo inválido.')); return; }
  if (!SESSION.user) { toast(t('Entre no sistema para importar.')); return; }
  const eid = ctxEmpresa(); if (!eid) { toast(t('Escolha uma empresa no seletor do topo para cadastrar.')); return; }
  let colls, cfg = null;
  if (o.formato === 'confianza-r1') { colls = {}; Object.keys(o).forEach(k => { if (Array.isArray(o[k])) colls[k] = o[k].map(r => ({ ...r, empresaId: eid })); }); }
  else { const m = migrarV1(o, eid); colls = m.out; cfg = m.cfg; }
  let n = 0; if (cfg) { await saveCfg(cfg); n++; }
  for (const [c, rows] of Object.entries(colls)) { if (!COLLS.includes(c)) continue; for (const r of rows) { const { id, ...rest } = r; if (await saveDoc(c, id || newId(c[0]), rest, { sistema: true })) n++; } }
  audit('importar', 'empresa', eid, { texto: `${n} registros` }); toast(t('{n} registros importados', { n }));
}

/* ===================== Ligações finais ===================== */
ACT.novo = a => {
  UI.menu = null; const k = a.dataset.k; render();
  const F = { g8d: () => g8dForm(), telemetria: () => telForm(), lubrificantes: () => lubForm(), pneus: () => pneuForm(), arrefecimento: () => arrForm(), fmea: () => fmeaForm(null, UI.tab.fmeaTipo || 'dFMEA'), plano: () => planoForm(), solicitacao: () => ACT.solNova(), mensagem: () => ACT.msgNova() };
  F[k] && F[k]();
};
initStore();

</script>
